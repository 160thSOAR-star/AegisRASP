org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true
# The project path contains non-ASCII characters (fixed workspace path);
# AGP refuses to build by default, so allow it explicitly.
android.overridePathCheck=true
# AGP 8.7.3 officially supports compileSdk up to 35; this project validates
# forward compatibility on API 36, so suppress the unsupported-compileSdk check.
android.suppressUnsupportedCompileSdk=36
